[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vehicle-intelligence-api"
version = "0.1.0"
description = "FastAPI backend foundation for vehicle intelligence workflows."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "pytest>=8.2.0",
  "httpx>=0.27.0",
  "psycopg[binary]>=3.2.0",
  "redis>=5.0.0",
  "neo4j>=5.20.0",
  "elasticsearch>=8.14.0,<9"
]

[project.optional-dependencies]
dev = [
  "ruff==0.16.0",
  "mypy>=1.10.0"
]

[project.scripts]
northstar-ingest = "ingestion.cli:main"

[tool.setuptools.packages.find]
include = ["api*", "ingestion*", "northstar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
