server {
    listen 80;
    server_name _;

    auth_basic "NorthStar";
    auth_basic_user_file /etc/nginx/htpasswd;
    client_max_body_size 20m;

    root /usr/share/nginx/html;
    index index.html;

    # The Angular app reads its API base from window.__NORTHSTAR_API__ (see
    # apps/northstar-web/src/app/core/api-config.ts). Pointing it at its own
    # origin lets one build serve on any host and port, with the API reached
    # through this same gateway and no CORS involved.
    sub_filter '</head>' '<script>window.__NORTHSTAR_API__ = window.location.origin;</script></head>';
    sub_filter_once on;

    # The API and its generated docs.
    location ~ ^/(v1|health|docs|redoc|openapi\.json)(/|$) {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Build output is content-hashed, so a name never changes meaning.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|ico|webmanifest)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Every other path is an Angular route; index.html must never be cached,
    # or a deploy would leave browsers pointing at bundles that no longer exist.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
