name: northstar

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${NORTHSTAR_POSTGRES_DB:-northstar}
      POSTGRES_USER: ${NORTHSTAR_POSTGRES_USER:-northstar}
      POSTGRES_PASSWORD: ${NORTHSTAR_POSTGRES_PASSWORD:?set NORTHSTAR_POSTGRES_PASSWORD}
    volumes:
      - northstar_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${NORTHSTAR_POSTGRES_USER:-northstar} -d ${NORTHSTAR_POSTGRES_DB:-northstar}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: ${NORTHSTAR_NEO4J_USER:-neo4j}/${NORTHSTAR_NEO4J_PASSWORD:?set NORTHSTAR_NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: ${NORTHSTAR_NEO4J_HEAP_INITIAL:-256m}
      NEO4J_server_memory_heap_max__size: ${NORTHSTAR_NEO4J_HEAP_MAX:-512m}
      NEO4J_server_memory_pagecache_size: ${NORTHSTAR_NEO4J_PAGECACHE:-256m}
    volumes:
      - northstar_neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${NORTHSTAR_ES_JAVA_OPTS:--Xms256m -Xmx512m}
    volumes:
      - northstar_elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - northstar_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: ${NORTHSTAR_LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql://${NORTHSTAR_POSTGRES_USER:-northstar}:${NORTHSTAR_POSTGRES_PASSWORD}@postgres:5432/${NORTHSTAR_POSTGRES_DB:-northstar}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NORTHSTAR_NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NORTHSTAR_NEO4J_PASSWORD}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: ${NORTHSTAR_CORS_ORIGINS:-http://127.0.0.1:8765}
      HEALTH_CHECK_TIMEOUT_SECONDS: ${NORTHSTAR_HEALTH_CHECK_TIMEOUT_SECONDS:-5}
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=8)",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "${NORTHSTAR_HTTP_PORT:-8765}:80"
    volumes:
      - ./infra/production/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/production/htpasswd:/etc/nginx/htpasswd:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  ingestion:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile
      target: ingestion
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: ${NORTHSTAR_LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql://${NORTHSTAR_POSTGRES_USER:-northstar}:${NORTHSTAR_POSTGRES_PASSWORD}@postgres:5432/${NORTHSTAR_POSTGRES_DB:-northstar}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NORTHSTAR_NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NORTHSTAR_NEO4J_PASSWORD}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./outputs:/bundles:ro
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  northstar_postgres_data:
  northstar_neo4j_data:
  northstar_elasticsearch_data:
  northstar_redis_data:
