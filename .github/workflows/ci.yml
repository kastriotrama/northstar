name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Validates that both service images build; publishing happens in a separate
  # workflow on merge, never on PRs.
  images:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build --target api -t northstar-api:ci .

      - name: Build ingestion image
        run: docker build --target ingestion -t northstar-ingestion:ci .

      - name: Smoke test API image
        run: docker run --rm northstar-api:ci python -c "import api.app.main"

      - name: Smoke test ingestion image
        run: docker run --rm northstar-ingestion:ci list-commands

  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: change_me
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: neo4j/change_me
        ports:
          - 7474:7474
          - 7687:7687
        options: >-
          --health-cmd "wget -q --spider http://localhost:7474 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.14.0
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fsS http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: test
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql://app:change_me@localhost:5432/app
      REDIS_URL: redis://localhost:6379/0
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: change_me
      ELASTICSEARCH_URL: http://localhost:9200
      HEALTH_CHECK_TIMEOUT_SECONDS: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Compile application packages
        run: python -m compileall api ingestion northstar

      - name: Validate live datastore health
        run: |
          python - <<'PY'
          import json
          import time

          from api.app.core.health import run_health_checks
          from api.app.core.settings import get_settings
          from api.app.features.health.repository import build_datastore_health_clients

          clients = build_datastore_health_clients(get_settings())
          deadline = time.monotonic() + 90

          while True:
              results = run_health_checks(clients)
              payload = [
                  {"name": result.name, "status": result.status, "detail": result.detail}
                  for result in results
              ]

              if all(result.status == "ok" for result in results):
                  print(json.dumps(payload, indent=2))
                  break

              if time.monotonic() >= deadline:
                  print(json.dumps(payload, indent=2))
                  raise SystemExit("One or more datastore health checks failed")

              time.sleep(3)
          PY

      - name: Lint application packages
        run: python -m ruff check .

      - name: Type check application packages
        run: python -m mypy api ingestion northstar

      - name: Verify approved normalization golden corpus
        run: >-
          python -m ingestion.golden_corpus verify
          tests/golden/normalization-reconciliation-v1.json

      - name: Test application packages
        run: python -m pytest
